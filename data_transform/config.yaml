# --- Gateway Connection ---
gateways:
  duckdb:
    connection:
      # For more information on configuring the connection to your execution engine, visit:
      # https://sqlmesh.readthedocs.io/en/stable/reference/configuration/#connection
      # https://sqlmesh.readthedocs.io/en/stable/integrations/engines/duckdb/#connection-options
      type: duckdb
      catalogs:
        sqlmesh_state:
          type: duckdb
          path: "{{ env_var('NABA_TOP_DATA__DATA_DIR') }}/{{ env_var('NABA_TOP_DATA__SQLMESH_STATE_DB') }}"
        sqlmesh_data:
          type: duckdb
          path: "{{ env_var('NABA_TOP_DATA__DATA_DIR') }}/{{ env_var('NABA_TOP_DATA__SQLMESH_DATA_DB') }}"
        raw_data:
          type: duckdb
          path: "{{ env_var('NABA_TOP_DATA__DATA_DIR') }}/{{ env_var('NABA_TOP_DATA__RAW_DATA_DB') }}"
          read_only: true
      concurrent_tasks: 1
      # register_comments: True
      # pre_ping: False
      # pretty_sql: False
      # schema_differ_overrides:
      # catalog_type_overrides:
      # catalogs:
      # extensions:
      # connector_config:
      # secrets:
      # filesystems:
      # token:

default_gateway: duckdb

# --- Model Defaults ---
# https://sqlmesh.readthedocs.io/en/stable/reference/model_configuration/#model-defaults

model_defaults:
  dialect: duckdb
  cron: "0 17 * * 5"
  cron_tz: "Europe/Riga"
  start: "2026-01-02"

# --- Linting Rules ---
# Enforce standards for your team
# https://sqlmesh.readthedocs.io/en/stable/guides/linter/

linter:
  enabled: true
  rules:
    - ambiguousorinvalidcolumn
    - invalidselectstarexpansion
    - noambiguousprojections

cache_dir: "{{ env_var('NABA_TOP_DATA__DATA_DIR') }}/sqlmesh_cache"

[project]
name = "naba-top"
version = "0.1.0"
description = "App for displaying radio Naba top 10 and top 25 lists for each week, as well as combining the lists into one top 100"
readme = "README.md"
requires-python = ">= 3.14"
authors = [{ name = "Jēkabs Balodis", email = "signalingpigeon@duck.com" }]
dependencies = [
  "duckdb>=1.4.3",
]

[dependency-groups]
dev = [
  "pytest>=8.4.2",
  "pytest-cov>=7.1.0",
  "ruff>=0.13.2",
  "sqlfluff>=3.5.0",
  "tombi>=0.6.17",
  "ty>=0.0.1a21",
]
streamlit = [
  "python-dateutil>=2.9.0.post0",
  "streamlit[auth]>=1.60.0",
  "polars[pyarrow]>=1.37.1",
  "babel>=2.18.0",
]

pipeline = [
  "beautifulsoup4[lxml]>=4.14.3",
  "httpx>=0.28.1",
  "typer>=0.24.1",
  "sqlmesh[lsp]>=0.236.3",
  "pydantic[email]>=2.12.5",
]

[tool.coverage.run]
omit = ["tests/*"]
source = [
  ".",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
  "D",  # pydocstyle
  "DOC",  # pydoclint
  "E",  # pycodestyle error
  "W",  # pycodestyle warning
  "F",  # pyflakes
  "I",  # isort
  "N",  # pep8 naming
  "UP",  # pyupgrade
  "B",  # flake8-bugbear
  "C4",  # flake8-comprehensions
  "PL",  # pylint
]
ignore = ["PLR2004", "F821"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "DOC"]

[tool.tombi.files]
exclude = [".venv/**"]

[tool.ty.environment]
python-platform = "linux"
python-version = "3.14"
